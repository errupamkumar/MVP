server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: plant-ride-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/app_mvp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: plant-ride-pool
      maximum-pool-size: ${DB_POOL_MAX:15}
      minimum-idle: 3
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1500000
      # Every session runs in plant time, so NOW()/CURDATE() in SQL and
      # LocalDateTime in Java agree regardless of the server's own zone.
      connection-init-sql: "SET time_zone = '+05:30'"
      # READ COMMITTED, not MySQL's default REPEATABLE READ. Matching locks the
      # route row and then reads seat loads; under REPEATABLE READ those reads
      # come from the snapshot taken before the lock was granted, so two riders
      # racing for the last seat both saw it free (caught by
      # OccupancyAndConcurrencyIntegrationTest.raceForTheLastSeat).
      transaction-isolation: TRANSACTION_READ_COMMITTED
  sql:
    init:
      # always = drop, recreate and reseed on every start (demo default).
      # Set DB_INIT_MODE=never to keep data between restarts.
      mode: ${DB_INIT_MODE:always}
      encoding: UTF-8
  jpa:
    open-in-view: false
    hibernate:
      # schema.sql owns the schema; Hibernate only checks that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Kolkata
  task:
    scheduling:
      pool:
        size: 2

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

plantride:
  timezone: Asia/Kolkata
  # Used to build the shareable tracking link (plantride.lhs/t/<token> in production)
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  security:
    # 256-bit minimum for HS256. Override JWT_SECRET in every non-local environment.
    jwt-secret: ${JWT_SECRET:plant-ride-local-dev-secret-change-me-0123456789abcdef0123456789}
    jwt-ttl-hours: ${JWT_TTL_HOURS:12}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  dispatch:
    enabled: ${DISPATCH_ENABLED:true}
    # "Phase 1 is rules plus a score, refreshed every 15 seconds" (deck slide 14)
    interval-ms: ${DISPATCH_INTERVAL_MS:15000}
  matching:
    average-speed-kmh: 18
    road-factor: 1.35
    dwell-minutes: 1
    weight-eta: 1.0
    weight-detour: 0.5
    weight-empty-km: 2.0
    weight-pooling: 1.5
    vendor-penalty: 1.0
  demo:
    reset-enabled: ${DEMO_RESET_ENABLED:true}

logging:
  level:
    com.srmecotech.plantride: INFO
